services:
  postgres:
    image: postgres:16-alpine
    container_name: talentmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentmatch
      POSTGRES_PASSWORD: talentmatch
      POSTGRES_DB: talentmatch
    ports:
      - "5432:5432"
    volumes:
      - talentmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentmatch -d talentmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talentmatch_pgdata:
